<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTs LaporFas - Portal Siswa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1580582932707-520aed937b7b?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            padding: 20px;
        }
        .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; }
        .header-logo { text-align: center; color: white; margin-bottom: 25px; }
        .logo-img { width: 90px; height: auto; filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.3)); margin-bottom: 10px; }
        .header-logo h1 { font-size: 2.2rem; font-weight: 800; text-shadow: 0px 2px 4px rgba(0,0,0,0.5); }
        .header-logo p { font-size: 0.95rem; opacity: 0.9; text-shadow: 0px 1px 3px rgba(0,0,0,0.5); }
        .badge-role {
            display: inline-flex; align-items: center; gap: 8px; padding: 8px 24px; border-radius: 20px;
            color: white; font-weight: 600; font-size: 0.95rem; margin-bottom: -15px; z-index: 2;
            background-color: #0b6638; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .card-box {
            background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px); border-radius: 16px;
            padding: 35px 30px 25px 30px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }
        .card-title { margin-top: 10px; margin-bottom: 5px; font-size: 1.25rem; color: #222; font-weight: 700; }
        .card-subtitle { font-size: 0.85rem; color: #666; margin-bottom: 25px; line-height: 1.4; }
        .form-group { position: relative; margin-bottom: 16px; }
        .form-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #777; }
        .form-control {
            width: 100%; padding: 12px 15px 12px 45px; border: 1px solid #e0e0e0; border-radius: 8px;
            background: #f7f9fa; font-size: 0.95rem; outline: none; transition: all 0.3s ease;
        }
        textarea.form-control { padding-left: 15px; resize: vertical; }
        .btn-submit {
            width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
            color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            margin-top: 15px; background-color: #0b6638; transition: background 0.3s ease;
        }
        .btn-submit:hover { background-color: #084c29; }
        .btn-danger { background-color: #d9534f; }
        .btn-danger:hover { background-color: #c9302c; }
        footer { position: absolute; bottom: 15px; width: 100%; text-align: center; color: rgba(255, 255, 255, 0.85); font-size: 0.8rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- LOGIN SISWA -->
    <div id="login-sec" class="container">
        <div class="header-logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Kementerian_Agama_Kemenag_Logo_%28Vector_Kemenag_Terbaru%29.png" class="logo-img">
            <h1>MTs LaporFas</h1>
            <p>Sistem Pelaporan Kerusakan Fasilitas Sekolah</p>
        </div>

        <div class="badge-role">
            <i class="fa-solid fa-user-graduate"></i> Login Siswa
        </div>

        <div class="card-box">
            <h2 class="card-title">Masuk ke Akun Siswa</h2>
            <p class="card-subtitle">Gunakan akun siswa untuk melaporkan kerusakan fasilitas sekolah.</p>

            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="userInput" class="form-control" placeholder="Username / NISN" required>
                </div>
                <div class="form-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="passInput" class="form-control" placeholder="Password" required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i> Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- FORM PELAPORAN SISWA -->
    <div id="dash-sec" class="container hidden">
        <div class="card-box">
            <h2 class="card-title" style="color: #0b6638;"><i class="fa-solid fa-pen-to-square"></i> Buat Laporan Kerusakan</h2>
            <p class="card-subtitle">Isi data fasilitas kelas yang mengalami kerusakan:</p>

            <form onsubmit="kirimLaporan(event)">
                <div class="form-group" style="margin-bottom:10px;">
                    <input type="text" id="lapPelapor" class="form-control" placeholder="Nama Pelapor & Kelas (misal: Ahmad - 8B)" style="padding-left:15px;" required>
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                    <input type="text" id="lapLokasi" class="form-control" placeholder="Lokasi Kerusakan (misal: Ruang Kelas 7A)" style="padding-left:15px;" required>
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                    <input type="text" id="lapBarang" class="form-control" placeholder="Barang yang Rusak (misal: Kipas Angin / Meja)" style="padding-left:15px;" required>
                </div>
                <div class="form-group" style="margin-bottom:10px;">
                    <textarea id="lapDeskripsi" class="form-control" rows="3" placeholder="Deskripsi kerusakan secara singkat..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-paper-plane"></i> Kirim Laporan
                </button>
            </form>
            
            <button onclick="logout()" class="btn-submit btn-danger">
                <i class="fa-solid fa-power-off"></i> Keluar / Logout
            </button>
        </div>
    </div>

    <footer>&copy; 2026 MTs LaporFas | MTs Beramal, Fasilitas Terjaga</footer>

    <!-- Firebase SDK (Menghubungkan ke Database Online) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // Konfigurasi Database Firebase Publik Gratis
        const firebaseConfig = {
            databaseURL: "https://mts-laporfas-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function prosesLogin(e) {
            e.preventDefault();
            const u = document.getElementById('userInput').value;
            const p = document.getElementById('passInput').value;

            // Contoh Login Siswa
            if (u === "siswa123" && p === "siswa123") {
                document.getElementById('login-sec').classList.add('hidden');
                document.getElementById('dash-sec').classList.remove('hidden');
            } else {
                alert("Username atau Password Siswa salah!\nGunakan username: siswa123 & pass: siswa123");
            }
        }

        function kirimLaporan(e) {
            e.preventDefault();
            const pelapor = document.getElementById('lapPelapor').value;
            const lokasi = document.getElementById('lapLokasi').value;
            const barang = document.getElementById('lapBarang').value;
            const deskripsi = document.getElementById('lapDeskripsi').value;

            // Kirim langsung ke Database Cloud secara online
            db.ref('laporan_kerusakan').push({
                tgl: new Date().toLocaleDateString('id-ID'),
                pelapor: pelapor,
                lokasi: lokasi,
                barang: barang,
                deskripsi: deskripsi,
                status: 'Menunggu'
            }).then(() => {
                alert('Laporan berhasil terkirim secara online ke Admin!');
                e.target.reset();
            }).catch(err => alert('Gagal mengirim: ' + err.message));
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
